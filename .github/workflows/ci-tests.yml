name: CI - Testes Automatizados

# Trigger: Executar em Pull Requests para o branch ia-main
on:
  pull_request:
    branches:
      - ia-main

jobs:
  test:
    name: Executar Testes Unitários
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
      # Step 1: Checkout do código
      - name: Checkout do código
        uses: actions/checkout@v4
      
      # Step 2: Setup Node.js com cache de dependências
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      # Step 3: Instalar dependências (npm ci para builds de CI)
      - name: Instalar dependências
        run: npm ci
      
      # Step 4: Executar testes unitários com Jest
      - name: Executar testes
        run: npm test
